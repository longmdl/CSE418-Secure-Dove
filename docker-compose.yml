services:
  nginx:
    build: ./nginx
    ports:
    - '80:80'
    - '443:443'
    volumes:
      - ./public:/public
  mongo:
    image: mongo:4.2.5
  myapp:
    build: .
    
    environment:
      WAIT_HOSTS: mongo:27017
      DOCKER_DB: true
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
    ports:
      - '8080:8080'
    volumes:
      - ./public:/public
  auth_server:
    build: 
      context: .
      dockerfile: auth/Dockerfile
    environment:
      WAIT_HOSTS: mongo:27017 
      DOCKER_DB: true
      