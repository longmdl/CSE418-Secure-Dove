# SD-12 rate limiting, all done here before a request reaches python.
# Only POSTs are counted: the key is empty for every other method and nginx
# skips requests with an empty key, so page loads and the chat's 1s polling
# are never throttled.
map $request_method $post_client {
    POST    $binary_remote_addr;
    default "";
}

# login: 10 attempts up front, then 1 more every 30s (10 per 5 min per IP)
limit_req_zone $post_client zone=login:10m rate=2r/m;
# register: 5 sign-ups up front, then 1 more per minute
limit_req_zone $post_client zone=register:10m rate=1r/m;
# every POST to myapp, which covers sending a message
limit_req_zone $post_client zone=writes:10m rate=1r/s;

server {
    server_name localhost;
    listen 443 ssl;
    ssl_certificate /etc/nginx/cert.pem;
    ssl_certificate_key /etc/nginx/private.key;

    # throttled requests get a 429 with the same generic text everywhere
    limit_req_status 429;
    error_page 429 = @rate_limited;

    location @rate_limited {
        default_type text/plain;
        return 429 "too many requests, try again later";
    }

    location /public/ {
        root /;
    }

    location /register {
        limit_req zone=register burst=4 nodelay;
        proxy_pass http://auth_server:8080;
        proxy_http_version 1.1;
    }

    location /login {
        limit_req zone=login burst=9 nodelay;
        proxy_pass http://auth_server:8080;
        proxy_http_version 1.1;
    }

    location /logout {
        proxy_pass http://auth_server:8080;
        proxy_http_version 1.1;
    }

    location / {
        limit_req zone=writes burst=20 nodelay;
        proxy_pass http://myapp:8080;
        proxy_http_version 1.1;
    }

    location /websocket {
        proxy_pass http://myapp:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Upgrade $http_upgrade;
    }
}

server {
    server_name localhost;
    listen 80;

    location / {
        return 301 https://localhost$request_uri;
    }
}
